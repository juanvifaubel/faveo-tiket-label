<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>faveo-ticket-labels</title>
  <link rel="stylesheet" href="src/popup/popup.css">
</head>
<body>
    <main>
      <header>
        <div>
          <p class="eyebrow">FAVEO HELPDESK</p>
          <h1>Mis etiquetas</h1>
        </div>
        <button id="gear-button" class="icon-button" type="button" title="Preferencias" aria-label="Abrir preferencias">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3" />
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
          </svg>
        </button>
      </header>

    <form id="unlock-form" hidden>
      <label for="unlock-password">Contraseña maestra</label>
      <input id="unlock-password" type="password" autocomplete="off" required>
      <p id="unlock-status" class="availability-status" role="status" aria-live="polite">Las credenciales de Google están cifradas. Desbloquéalas para consultar y crear eventos en el calendario.</p>
      <button type="submit">Desbloquear</button>
    </form>

    <form id="label-form">
      <label for="ticket-number">Número de ticket</label>
      <input id="ticket-number" name="ticketNumber" placeholder="Abre un ticket para autocompletar" autocomplete="off" readonly>

      <label>Fecha de la cita</label>
      <div class="date-actions">
        <button id="today-button" class="secondary-button" type="button">Hoy</button>
        <button id="calendar-toggle" class="calendar-button" type="button" aria-expanded="false" aria-controls="calendar-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 10h18" /></svg>
          <span id="selected-date">Seleccionar fecha</span>
        </button>
      </div>

      <section id="calendar-panel" class="calendar-panel" aria-label="Selector de fecha" hidden>
        <div class="calendar-header">
          <button id="previous-month" class="calendar-nav" type="button" aria-label="Mes anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button>
          <h2 id="calendar-month"></h2>
          <button id="next-month" class="calendar-nav" type="button" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg></button>
        </div>
        <div class="calendar-weekdays" aria-hidden="true"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="Días del mes"></div>
      </section>

      <div class="slot-heading">
        <label for="duration-select">Duración</label>
        <select id="duration-select" name="duration">
          <option value="15" selected>15 min</option>
          <option value="30">30 min</option>
          <option value="60">1 h</option>
        </select>
      </div>
      <p id="availability-status" class="availability-status" role="status" aria-live="polite">Selecciona una fecha para consultar disponibilidad.</p>
      <div id="time-slots" class="time-slots" aria-label="Franjas horarias disponibles"></div>

      <button id="submit-button" type="submit">Guardar cita</button>
      <button id="cancel-edit" class="cancel-edit" type="button" hidden>Cancelar edición</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <section>
      <div class="section-title">
        <h2>Guardadas</h2>
        <label class="hide-past"><input id="hide-past" type="checkbox"> Ocultar pasadas</label>
        <button id="clear-all" class="text-button" type="button">Limpiar</button>
      </div>
      <ul id="label-list"></ul>
      <p id="empty-state">Todavía no hay etiquetas.</p>
    </section>
  </main>
  <script src="src/shared/core.js"></script>
  <script src="src/shared/secure-store.js"></script>
  <script src="src/shared/calendar-api.js"></script>
  <script src="src/popup/calendar-sync.js"></script>
  <script src="src/popup/ticket-reader.js"></script>
  <script src="src/popup/schedule-picker.js"></script>
  <script src="src/popup/labels-view.js"></script>
  <script src="src/popup/controller.js"></script>
</body>
</html>
